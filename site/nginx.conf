server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro's static output already has a custom 404.html - use it.
    error_page 404 /404.html;

    # Hashed build assets (_astro/*) can be cached hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Live data: addon stats and the activity feed, kept current by the
    # fetcher service in the shared live-data volume (see site/fetcher/).
    # Pages fetch these to update without a rebuild, and keep the values from
    # the last build if they are missing. no-cache plus nginx's ETag means
    # browsers revalidate and get a 304 until the data changes.
    location ~ ^/api/(?<live_file>addon-stats|recent-activity)\.json$ {
        alias /srv/live/$live_file.json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else: short cache, since page content can change without
    # the filename changing.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
}
