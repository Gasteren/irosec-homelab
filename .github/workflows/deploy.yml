name: Deploy wiki

# Rebuilds and redeploys the site when content or site code changes. Addon
# stats and the activity feed are fetched live by the site, so the sync bot's
# data commits don't need a deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/addon-stats.json'
      - 'data/recent-activity.json'
  workflow_dispatch: {}

# While the runner is offline, pushes queue up; only the newest one deploys.
concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dockerserver]
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the repo into the compose directory
        # .env holds server-side settings and isn't in the repo, so keep it.
        run: |
          rsync -a --delete --exclude '.git/' --exclude '.env' ./ /mnt/mainraid/compose/starlight-wiki/

      - name: Build and deploy
        working-directory: /mnt/mainraid/compose/starlight-wiki
        run: docker compose up -d --build --wait --wait-timeout 120
