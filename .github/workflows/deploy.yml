name: Deploy wiki

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, dockerserver]
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs into site scaffold
        run: |
          SCAFFOLD=/mnt/mainraid/compose/starlight-wiki
          mkdir -p "$SCAFFOLD/src/content/docs"
          for dir in infrastructure security-stack projects lessons-learned addons; do
            rm -rf "$SCAFFOLD/src/content/docs/$dir"
            cp -r "$dir" "$SCAFFOLD/src/content/docs/$dir"
          done
          mkdir -p "$SCAFFOLD/src/data"
          cp data/addon-stats.json "$SCAFFOLD/src/data/addon-stats.json" 

      - name: Build and deploy
        working-directory: /mnt/mainraid/compose/starlight-wiki
        run: |
          docker compose build
          docker compose up -d
