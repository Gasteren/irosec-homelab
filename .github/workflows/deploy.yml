name: Deploy wiki

# Rebuilds and redeploys the site and its fetcher when content or code
# changes. Addon stats and the activity feed don't need a deploy: the fetcher
# keeps them current on the server.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# While the runner is offline, pushes queue up; only the newest one deploys.
concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dockerserver]
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the repo into the compose directory
        # .env holds the CurseForge API key and isn't in the repo, so keep it.
        run: |
          rsync -a --delete --exclude '.git/' --exclude '.env' ./ /mnt/mainraid/compose/starlight-wiki/

      - name: Use the fetcher's latest data as the build-time values
        # data/*.json in the repo are only seeds. Pages show these values
        # until the live ones load, so take the current copies from the
        # running fetcher when there is one.
        working-directory: /mnt/mainraid/compose/starlight-wiki
        run: |
          for f in addon-stats recent-activity; do
            if docker compose cp "fetcher:/data/$f.json" "/tmp/$f.json" 2>/dev/null && jq -e . "/tmp/$f.json" >/dev/null; then
              mv "/tmp/$f.json" "data/$f.json"
            else
              echo "No live $f.json from the fetcher; building with the copy from the repo"
            fi
          done

      - name: Build and deploy
        working-directory: /mnt/mainraid/compose/starlight-wiki
        run: docker compose up -d --build --wait --wait-timeout 120
