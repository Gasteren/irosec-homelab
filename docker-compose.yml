services:
  starlight-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starlight-wiki
    restart: unless-stopped
    ports:
      - "8093:80"   # pick a free host port; NPM proxies wiki.irosec.com -> this
    # Watchtower will pick this up like your other containers unless you
    # add it to the WATCHTOWER_DISABLE_CONTAINERS exclusion list -
    # for a locally-built image (no upstream registry tag), exclude it,
    # since Watchtower can't pull updates for it anyway.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
